name: Apply's browsers
description: >-
  Playwright's Chromium and Chrome for Testing, for the jobs that run Apply's
  browser tests (ci.yml's apply and apply-hostile, apply-nightly.yml; KAN-780),
  after apply-setup. Never in ci.yml's apply-fast, which runs the fast tests and
  the tile's: some of their files have browser cases that skip without a
  browser, and with one installed first they ran in parallel and hung the fast
  tests at 96% until the step's 5 minutes ran out (2026-11-15).
runs:
  using: composite
  steps:
    # Playwright's Chromium and its Chrome for Testing follow the Playwright that uv.lock
    # pins. A miss costs one download.
    - uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ms-playwright
        key: chrome-for-testing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apply-agent/uv.lock') }}
    - shell: bash
      working-directory: apply-agent
      run: uv run playwright install chromium
    # The plain-Worker tests skip without it, so a failed install fails the job here instead.
    - name: Chrome for Testing is installed
      shell: bash
      working-directory: apply-agent
      run: uv run python -c "from apply.plain.launcher import chrome_for_testing; print(chrome_for_testing())"
