# Temporary (KAN-899, docs/secrets.md, "Still open"): checks the Infisical
# syncs. Prints each synced secret's name and the length of its value, never
# the value, and the names the new deploy step would send to the API Worker.
# Delete this file once the syncs are checked.
name: Secrets check

on:
  push:
    branches: [KAN-899-design-better-way-to-properly-store-password-secrets]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Names and lengths
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          printf '%s' "$ALL_SECRETS" | jq -r '
            to_entries[]
            | select((.key | startswith("API_") or startswith("WEB_"))
                     or .key == "DATABASE_URL" or .key == "SCOUT_ENDPOINTS")
            | "\(.key): \(.value | length) characters"
              + (if (.value | startswith("${")) then ", NOT FILLED IN" else "" end)'
      # The same filter the new "Set runtime secrets" step uses.
      - name: What the deploy would send (names only)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          printf '%s' "$ALL_SECRETS" \
            | jq -r 'with_entries(select((.key | startswith("API_")) and .value != "") | .key |= ltrimstr("API_")) | keys[]'
