name: Publish the Fill engine for WorkIt Auto Apply

# KAN-836 (W7 of docs/desktop_application_auto_apply.md, D27): signs the engine that main's fill-engine pointer
# records and puts it last in the private ApplyEngine bucket's builds.json, where GET /apply-app/engine serves it
# (backend/app/scripts/publish_engine.py). .github/CLAUDE.md's "Publish the Fill engine" section has the why and
# the one-time setup.
#
# It runs on a merge to main that moves the engine pointer or the min app file, and by hand from main
# (`gh workflow run publish-engine.yml`). Never on a PR: the key signs code every student's app runs. A run with
# nothing new changes nothing, so a re-run is safe. An edit to this file starts no publish.
on:
  push:
    branches: [main]
    paths:
      - "autofiller_extension/fill-engine"
      - "backend/app/scripts/engine_min_app.txt"
  workflow_dispatch:

# One run at a time: each one reads builds.json and writes it back.
concurrency:
  group: publish-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # A push is already main only; a dispatch from another branch would sign that branch's engine.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The signing key is a secret of this environment, which takes jobs from main only.
    environment: auto-apply-desktop
    steps:
      # fill-engine is private: the default GITHUB_TOKEN can't read it.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      # actions/checkout has landed fill-engine on its branch tip instead of the recorded commit
      # (.github/CLAUDE.md): here that would sign an engine no PR reviewed.
      - name: Pin fill-engine to the commit this branch actually records
        run: |
          PINNED=$(git ls-tree HEAD autofiller_extension/fill-engine | awk '{print $3}')
          git -C autofiller_extension/fill-engine fetch --depth 1 origin "$PINNED"
          git -C autofiller_extension/fill-engine checkout --detach "$PINNED"
          echo "fill-engine pinned at: $(git -C autofiller_extension/fill-engine rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked

      # The Supabase project is the one the deployed API reads (its API_* secrets, docs/secrets.md), so the build
      # goes to the bucket the API serves from. The script refuses a key whose public half Apply doesn't hold.
      - name: Sign and publish
        working-directory: backend
        env:
          SIGNING_KEY: ${{ secrets.APPLY_ENGINE_SIGNING_KEY }}
          SUPABASE_URL: ${{ secrets.API_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.API_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The APPLY_ENGINE_SIGNING_KEY secret is not set in the auto-apply-desktop environment (.github/CLAUDE.md, \"Publish the Fill engine\")."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::The API_SUPABASE_URL or API_SUPABASE_SERVICE_KEY secret is not set (docs/secrets.md, workit-prod/api)."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/engine-signing-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE")
          uv run python -m app.scripts.publish_engine publish --key "$KEY_FILE"
