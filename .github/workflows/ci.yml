name: CI

# Every pull request, stacked ones too: a PR on another PR's branch got no checks, and failures sat unseen on it.
on:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Whether FILL_ENGINE_TOKEN (read access to the private fill-engine submodule) is set. Without it the
  # jobs and steps below that need the engine are skipped, and this job's summary says SKIPPED.
  engine:
    uses: ./.github/workflows/engine-token.yml
    with:
      skipped: the extension's Playwright suite and the Chrome Web Store package build
    secrets: inherit

  # The Chrome Web Store package (KAN-463): store/build.mjs fails if any packaged file names localhost,
  # vercel.app or "Prototype", and the specs read the zip back and check the website calls the
  # extension's ID. The package needs the fill-engine submodule: the build steps run once
  # FILL_ENGINE_TOKEN is set (the engine job), and show as skipped otherwise; the ID check runs either way.
  extension-store-build:
    needs: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autofiller_extension
    steps:
      - uses: actions/checkout@v4
        if: needs.engine.outputs.set == 'true'
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      # actions/checkout's own submodule handling has been seen landing on
      # fill-engine's current branch tip instead of the commit actually
      # recorded here, even with fetch-depth: 0 (KAN-447, 2026-11-09: a
      # run pinning fill-engine@0.3.26 built and tested 0.3.30). Force it.
      - name: Pin fill-engine to the commit this branch actually records
        if: needs.engine.outputs.set == 'true'
        working-directory: .
        run: |
          PINNED=$(git ls-tree HEAD autofiller_extension/fill-engine | awk '{print $3}')
          git -C autofiller_extension/fill-engine fetch --depth 1 origin "$PINNED"
          git -C autofiller_extension/fill-engine checkout --detach "$PINNED"
          echo "fill-engine pinned at: $(git -C autofiller_extension/fill-engine rev-parse HEAD)"
      - uses: actions/checkout@v4
        if: needs.engine.outputs.set != 'true'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: autofiller_extension/test
      - run: npx playwright test extension-id.spec.ts --project=page
        working-directory: autofiller_extension/test
      # esbuild, which minifies what the package ships (KAN-744).
      - run: npm ci
        if: needs.engine.outputs.set == 'true'
        working-directory: autofiller_extension/store
      - name: Build the Store package
        if: needs.engine.outputs.set == 'true'
        run: node store/build.mjs
      - name: Check the Store package
        if: needs.engine.outputs.set == 'true'
        run: npx playwright test store-build.spec.ts --project=page
        working-directory: autofiller_extension/test

  # Which parts a PR touches, so a job can skip a PR that can't break it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      # Apply's jobs: apply-fast (Ubuntu) on any Apply change; the Mac jobs (apply, apply-hostile) on one a Mac step
      # can read, which leaves out the student page and the docs (KAN-837).
      apply: ${{ steps.filter.outputs.apply_shared == 'true' || steps.filter.outputs.apply_agent == 'true' }}
      apply_mac: ${{ steps.filter.outputs.apply_shared == 'true' || steps.apply_code.outputs.code == 'true' }}
      apply_window: ${{ steps.filter.outputs.apply_window }}
      hostile_pages: ${{ steps.filter.outputs.hostile_pages }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # A PR's files come from the API; any other event diffs the checkout.
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The backend's tests read only backend/ and the two packages it
            # installs, scout/ and scraper/; no other folder can break them
            backend:
              - backend/**
              - scout/**
              - scraper/**
              # The Rules table the API serves (KAN-756) is the engine's
              - autofiller_extension/fill-engine
              - .github/workflows/ci.yml
            extension:
              - autofiller_extension/**
              - .github/workflows/ci.yml
              - .github/workflows/engine-token.yml
              - .github/actions/extension-setup/**
            apply_agent:
              - apply-agent/**
            # What every Apply job reads outside apply-agent/
            apply_shared:
              - autofiller_extension/fill-engine
              # Apply's truth check is a copy of this file; its test compares them
              - backend/app/auto_apply/truth.py
              - .github/workflows/ci.yml
              - .github/workflows/engine-token.yml
              - .github/actions/apply-setup/**
              - .github/actions/apply-browsers/**
            # The student page's source and the built file a Student build ships (KAN-867)
            apply_window:
              - apply-agent/window/**
              - apply-agent/src/apply/student_page/**
              - .nvmrc
              - .github/workflows/ci.yml
            # What the hostile pages' control reads (KAN-780): the pages, the fake site, Chromium (uv.lock pins
            # Playwright) and the runner's setup. The control runs no Apply code, so no other change can turn it red.
            # A module of tests/ that the hostile file or conftest.py imports joins the list.
            hostile_pages:
              - apply-agent/tests/test_submit_guard_hostile.py
              - apply-agent/tests/plain_fakes.py
              - apply-agent/tests/conftest.py
              - apply-agent/tests/network_block.py
              - apply-agent/pyproject.toml
              - apply-agent/uv.lock
              - .github/workflows/ci.yml
              - .github/actions/apply-setup/**
              - .github/actions/apply-browsers/**
      # apply-agent/ less what no Mac step reads: the student page (its own job, apply-window, and apply-fast's
      # test_app_window.py check it), its built file and the docs (KAN-837). A file counts only when it matches every
      # pattern here, so each `!` takes a folder out; under the first step's default ('some') a `!` takes nothing out.
      - uses: dorny/paths-filter@v3
        id: apply_code
        with:
          predicate-quantifier: every
          filters: |
            code:
              - apply-agent/**
              - '!apply-agent/window/**'
              - '!apply-agent/src/apply/student_page/**'
              - '!apply-agent/docs/**'
              - '!apply-agent/**/*.md'

  # The extension's smoke specs (autofiller_extension/test/ci-smoke.txt),
  # headless, on the engine the submodule pins (KAN-464). The whole suite, 40
  # minutes on one worker, runs nightly instead (extension-nightly.yml).
  # Skipped without FILL_ENGINE_TOKEN (the engine job).
  extension:
    needs: [changes, engine]
    if: needs.changes.outputs.extension == 'true' && needs.engine.outputs.set == 'true'
    # macOS, as most students run Chrome: on Linux, Chromium asks
    # accounts.google.com on its own and scrolls and focuses differently, so
    # a few specs fail there only. Free on a public repo.
    runs-on: macos-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: autofiller_extension/test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      # See the same step's comment in extension-store-build, above.
      - name: Pin fill-engine to the commit this branch actually records
        working-directory: .
        run: |
          PINNED=$(git ls-tree HEAD autofiller_extension/fill-engine | awk '{print $3}')
          git -C autofiller_extension/fill-engine fetch --depth 1 origin "$PINNED"
          git -C autofiller_extension/fill-engine checkout --detach "$PINNED"
          echo "fill-engine pinned at: $(git -C autofiller_extension/fill-engine rev-parse HEAD)"
      - uses: ./.github/actions/extension-setup
      # The extension loads the engine's committed dist/; it must be what the
      # pinned src/ builds to.
      - name: The pinned engine's dist/ is built from its src/
        working-directory: autofiller_extension/fill-engine
        run: |
          npm ci
          npm run build
          git diff --exit-code --stat dist/ || {
            echo "::error::The pinned fill-engine commit's dist/ is stale."
            exit 1
          }
      - name: Smoke specs
        timeout-minutes: 6
        run: npx playwright test --grep-invert @nightly --workers=2 $(grep -v '^#' ci-smoke.txt)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extension-test-results
          path: autofiller_extension/test/test-results
          retention-days: 7

  # Apply (apply-agent/, KAN-535) in three jobs side by side. apply-fast, on Ubuntu: ruff, the fast tests (the files
  # that need no browser, no network and no `claude` CLI) and the tile's tests. apply, on macOS: the plain-Worker
  # tests (KAN-667). apply-hostile, on macOS: the hostile pages (KAN-780). The tests read the engine's saved forms, so
  # each job needs the fill-engine submodule and is skipped without FILL_ENGINE_TOKEN (the engine job).
  #
  # Why apart (KAN-837): the organization runs at most 5 macOS jobs at once, shared by every PR and the nightly
  # runs, and a Mac job waited in the queue while Ubuntu runners stood free. Only what needs a Mac runs on one,
  # and a PR that changes only the student page or the docs starts no Mac job (apply_mac).
  #
  # Each step has its own limit, and the job's is their sum, so a hang fails in its own step and the
  # job's limit never stops a run whose every step is inside its own (KAN-780).
  apply-fast:
    needs: [changes, engine]
    if: needs.changes.outputs.apply == 'true' && needs.engine.outputs.set == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apply-agent
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      - uses: ./.github/actions/apply-setup
        timeout-minutes: 5
      - run: uv run ruff check .
        timeout-minutes: 2
      # The files that need no browser, network or `claude` CLI. A new test
      # file that needs none of them joins the list. Each step runs its tests
      # on the runner's cores with pytest-xdist (-n auto: each process has its
      # own APPLY_HOME, fake servers on port 0 and its own plain Worker), and
      # each has its own limit, so a hang fails that step (KAN-780). `nightly`
      # tests run in apply-nightly.yml instead.
      - name: Fast tests
        timeout-minutes: 5
        run: |
          uv run pytest -q -n auto --durations=15 -m "not nightly" \
            tests/test_accounts.py \
            tests/test_accounts_tab.py \
            tests/test_answer_bank.py \
            tests/test_answer_sync.py \
            tests/test_answering.py \
            tests/test_applicant_name.py \
            tests/test_app_control.py \
            tests/test_app_window.py \
            tests/test_first_run.py \
            tests/test_ask.py \
            tests/test_apply_home.py \
            tests/test_approve.py \
            tests/test_back_to_app.py \
            tests/test_bot_signals.py \
            tests/test_captcha.py \
            tests/test_chrome_reaper.py \
            tests/test_claude_answers.py \
            tests/test_claude_cli.py \
            tests/test_clock.py \
            tests/test_code_box.py \
            tests/test_company_brief.py \
            tests/test_company_material.py \
            tests/test_cover_letter.py \
            tests/test_daily_cap.py \
            tests/test_dock_app.py \
            tests/test_each_os.py \
            tests/test_eightfold_filler.py \
            tests/test_engine_download.py \
            tests/test_employer_mail.py \
            tests/test_fill_engine.py \
            tests/test_focus.py \
            tests/test_form_steps.py \
            tests/test_form_tree.py \
            tests/test_guard_scripts_compile.py \
            tests/test_gates.py \
            tests/test_gmail.py \
            tests/test_graduate_only.py \
            tests/test_ask_model.py \
            tests/test_into.py \
            tests/test_open_slots.py \
            tests/test_keepalive.py \
            tests/test_left_behind.py \
            tests/test_locks.py \
            tests/test_preflight.py \
            tests/test_queued_names.py \
            tests/test_keychain_contract.py \
            tests/test_mail_command.py \
            tests/test_masked.py \
            tests/test_matches.py \
            tests/test_network_block.py \
            tests/test_notification.py \
            tests/test_optional_ask.py \
            tests/test_other_roles.py \
            tests/test_outside_us.py \
            tests/test_phone_push.py \
            tests/test_plain_bridge.py \
            tests/test_plain_channel.py \
            tests/test_plain_seed_setup.py \
            tests/test_plain_trusted_rules.py \
            tests/test_presubmit_check.py \
            tests/test_privacy_gate.py \
            tests/test_profile.py \
            tests/test_rankings.py \
            tests/test_records_contract.py \
            tests/test_regenerate.py \
            tests/test_repair_requests.py \
            tests/test_report.py \
            tests/test_requests.py \
            tests/test_rescue_elsewhere.py \
            tests/test_resume_check.py \
            tests/test_restart.py \
            tests/test_sameness.py \
            tests/test_schedule.py \
            tests/test_send_click.py \
            tests/test_sheet_import.py \
            tests/test_sheet_tidy.py \
            tests/test_sheet_tracker.py \
            tests/test_stock.py \
            tests/test_story_map.py \
            tests/test_tailored_resume.py \
            tests/test_temp_state.py \
            tests/test_third_party_notices.py \
            tests/test_strip_js_comments.py \
            tests/test_tracker_cleanup.py \
            tests/test_already_applied.py \
            tests/test_tracker_contract.py \
            tests/test_tracker_record.py \
            tests/test_truth.py \
            tests/test_student_build.py \
            tests/test_worker_date.py \
            tests/test_worker_extension_store.py \
            tests/test_workit_login.py
      # The tile's tests time frames and retries in real seconds: in one
      # process, as beside other test processes they missed their timing (KAN-780).
      - name: Tile tests
        timeout-minutes: 3
        run: |
          uv run pytest -q --durations=10 -m "not nightly" \
            tests/test_plain_tile_identity.py \
            tests/test_plain_tile_refilm.py \
            tests/test_plain_stale_extension.py \
            tests/test_plain_tile_fallback.py \
            tests/test_review_kan717_hostile.py
      # No apply-browsers here: the fast tests' and the tile's files have browser cases that skip without one, and
      # with the browsers installed first they ran in parallel and hung the fast tests (2026-11-15).

  apply:
    needs: [changes, engine]
    if: needs.changes.outputs.apply_mac == 'true' && needs.engine.outputs.set == 'true'
    # macOS: a plain Worker starts through `open` and Chrome for Testing's .app
    # (apply/plain/launcher.py), as on the Macs Apply runs on.
    runs-on: macos-latest
    timeout-minutes: 24
    defaults:
      run:
        working-directory: apply-agent
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      - uses: ./.github/actions/apply-setup
        timeout-minutes: 5
      - uses: ./.github/actions/apply-browsers
        timeout-minutes: 5
      # The worker extension's page scripts in a window without focus (KAN-709).
      - name: Plain Worker focus
        timeout-minutes: 2
        run: uv run pytest -q tests/test_plain_focus.py
      # test_upload_origin.py's CDP cases (KAN-795): Playwright's Chromium, a server on port 0 and a tmp_path
      # each, so they run in parallel, apart from its plain Worker cases below (22 took 64 s in one process
      # on a 10-core Mac, 24 s in 3; KAN-780).
      - name: Upload origin on CDP
        timeout-minutes: 3
        run: uv run pytest -q -n auto --durations=5 -m "not nightly" tests/test_upload_origin.py -k "upload_origin and test_cdp"
      # A real plain Worker on a fake job system. A new suite this fast joins the list, as do
      # test_upload_origin.py's plain Worker and no-browser cases. One process: in parallel each pays
      # a 40 s Worker start and the typing tests' timing slips, for no gain (KAN-780). 101 tests took
      # 233 s (2026-11-14), so the limit is 6; a CDP case runs in a parallel step, as above.
      - name: Plain-Worker tests
        timeout-minutes: 6
        run: |
          uv run pytest -q -rs --durations=15 -m "not nightly" -k "not (upload_origin and test_cdp)" \
            tests/test_plain_guards.py \
            tests/test_plain_routing.py \
            tests/test_plain_typing.py \
            tests/test_upload_origin.py

  # The student page (apply-agent/window/, KAN-867): its view model's tests, then its build, which must match the file
  # committed into the package (apply/student_page/index.html), so the page a Student build ships can't drift from its
  # source. Rebuild it with `npm run build` in apply-agent/window and commit the file.
  apply-window:
    needs: changes
    if: needs.changes.outputs.apply_window == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apply-agent/window
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apply-agent/window/package-lock.json
      - run: npm ci
      - run: npm test
      # The page's logos load from Brandfetch with the website's public client id (KAN-871), as deploy.yml builds
      # the website with it; the committed page is built with it too.
      - run: npm run build
        env:
          NEXT_PUBLIC_BRANDFETCH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_BRANDFETCH_CLIENT_ID }}
      - run: git diff --exit-code -- ../src/apply/student_page

  # The submit guard's hostile pages (KAN-666) on a runner of their own, beside the apply job, so a PR waits for the
  # longer of the two, not their sum (KAN-780). Limits as in the apply job: the job's is its steps' sum.
  apply-hostile:
    needs: [changes, engine]
    if: needs.changes.outputs.apply_mac == 'true' && needs.engine.outputs.set == 'true'
    runs-on: macos-latest
    timeout-minutes: 29
    defaults:
      run:
        working-directory: apply-agent
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      - uses: ./.github/actions/apply-setup
        timeout-minutes: 5
      - uses: ./.github/actions/apply-browsers
        timeout-minutes: 5
      # No-browser, CDP and plain Worker cases. On PRs every page and every path at least once, each page on its own
      # path; every pair nightly. One process per core: on 8 processes (2026-11-15) 220 cases took 237 s, no less than
      # 303 had on 3, the held-page tests ran half again as long, and three plain-Worker cases missed their timing.
      - name: Submit guard hostile pages
        timeout-minutes: 12
        run: uv run pytest -q -n auto --dist loadgroup --durations=15 -m "not nightly" tests/test_submit_guard_hostile.py
      # Every page's control, on a PR that changes what the control reads (the hostile_pages filter); the others
      # run three on PRs and the rest nightly. Runs even after a red step above, so neither hides the other.
      - name: Every hostile page's control
        if: ${{ !cancelled() && needs.changes.outputs.hostile_pages == 'true' }}
        timeout-minutes: 4
        run: uv run pytest -q -n auto --durations=5 "tests/test_submit_guard_hostile.py::test_without_the_guard_each_hostile_page_sends"

  # The API's Cloudflare Worker (KAN-169): a type error here would otherwise
  # surface only when the deploy on main fails.
  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check

  # Skipped on a PR that touches none of backend/, scout/ and scraper/ (the
  # changes job): 37 of the 40 PRs merged before 2026-11-04 touched neither, and each
  # waited about 7 minutes for it. A skipped job passes a required check.
  backend:
    needs: [changes, engine]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The real-Postgres tests (backend/tests/conftest.py) create their own
    # database here and migrate it to head before the first one runs. The
    # image ships pgvector, which the migrations install.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54330:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54330/postgres
    steps:
      # The Rules table's tests (tests/test_rules_watermark.py, KAN-756) read
      # the fill-engine submodule's table and run its round trip with Node;
      # without FILL_ENGINE_TOKEN they skip and the rest runs.
      - uses: actions/checkout@v4
        if: needs.engine.outputs.set == 'true'
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      - name: Pin fill-engine to the commit this branch actually records
        if: needs.engine.outputs.set == 'true'
        working-directory: .
        run: |
          PINNED=$(git ls-tree HEAD autofiller_extension/fill-engine | awk '{print $3}')
          git -C autofiller_extension/fill-engine fetch --depth 1 origin "$PINNED"
          git -C autofiller_extension/fill-engine checkout --detach "$PINNED"
          echo "fill-engine pinned at: $(git -C autofiller_extension/fill-engine rev-parse HEAD)"
      - uses: actions/checkout@v4
        if: needs.engine.outputs.set != 'true'
      # Node 22 reads the engine's TypeScript fixtures as they are.
      - uses: actions/setup-node@v4
        if: needs.engine.outputs.set == 'true'
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked
      - run: uv run ruff check .
      # Real Tectonic for the template text test (KAN-204). The cache key
      # follows the pinned version and the fixed resume, so a change to
      # either warms again; a miss only costs the ~1 minute download.
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: tectonic-${{ hashFiles('backend/scripts/fetch_tectonic.py', 'backend/app/services/resume_render/*.py', 'backend/app/services/resume_render/*.tex') }}
      - run: python3 scripts/fetch_tectonic.py
      # One pytest worker per core (pytest-xdist): each worker makes and
      # migrates its own test database (tests/conftest.py), so they share no
      # table. Run one at a time, the suite took about 6.5 minutes.
      - run: uv run pytest -n auto
      # Scout's package (../scout) is installed here, so it is linted and tested here.
      - run: uv run ruff check ../scout
      - run: uv run pytest ../scout/tests

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      # Stdlib-only package: nothing to install, so ruff and pytest run as one-off tools.
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pytest -v
