name: Publish WorkIt Auto Apply

# KAN-941 (W8 step 4 of docs/desktop_application_auto_apply.md): copies a release of the Mac app from its draft
# GitHub Release to the R2 bucket behind https://downloads.workitjobs.ai. Every installed app reads the feed there
# (appcast.xml) and updates itself, and the website's Download for Mac links the DMG. A Mac builds and signs the
# release and makes the draft (apply-agent/scripts/publish_app.py, D32). .github/CLAUDE.md's "Publish WorkIt Auto
# Apply" section has the why and the one-time setup.
#
# By hand from main only: `gh workflow run publish-app.yml --ref main -f build=<build number>`. A re-run of the same
# build writes the same files again, so it is safe.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "The release's build number (12 digits), as publish_app.py printed it"
        required: true

# One publish at a time: two would race to write the feed.
concurrency:
  group: publish-app
  cancel-in-progress: false

permissions:
  contents: write # GitHub shows a draft release only to a token that may write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The R2 keys are secrets of this environment, which takes jobs from main only.
    environment: apply-engine
    env:
      BUILD: ${{ inputs.build }}
      BUCKET: auto-apply-desktop
      SITE: https://downloads.workitjobs.ai
    steps:
      - name: Download the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$BUILD" =~ ^[0-9]{12}$ ]]; then
            echo "::error::The build number is the app's 12 digits (CFBundleVersion), as publish_app.py printed it."
            exit 1
          fi
          gh release download "auto-apply-$BUILD" --repo "$GITHUB_REPOSITORY" --dir out
          if ! grep -q "<sparkle:version>$BUILD</sparkle:version>" out/appcast.xml \
            || ! grep -q "url=\"$SITE/WorkIt-Auto-Apply-$BUILD.dmg\"" out/appcast.xml \
            || [ ! -f "out/WorkIt-Auto-Apply-$BUILD.dmg" ]; then
            echo "::error::Release auto-apply-$BUILD must hold WorkIt-Auto-Apply-$BUILD.dmg and the appcast.xml that offers it: make it again with publish_app.py."
            exit 1
          fi

      # Installed apps ignore an older build, but the website's DMG would go back to it for every new student.
      - name: Refuse a build older than the live one
        run: |
          LIVE=$(curl -fsS "$SITE/appcast.xml" | grep -o '<sparkle:version>[0-9]*' | grep -o '[0-9]*$' || true)
          if [ -n "$LIVE" ] && [ "$LIVE" -gt "$BUILD" ]; then
            echo "::error::The live build is $LIVE, newer than $BUILD. Publish a new release instead."
            exit 1
          fi
          echo "Live build: ${LIVE:-none}"

      - name: Upload to R2, the feed last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          # Only the checksums S3 requires: R2 refused the ones AWS CLI 2.23 and later add by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY or R2_ENDPOINT is not set in the apply-engine environment (docs/secrets.md, workit-prod/auto-apply-desktop)."
            exit 1
          fi
          put() { aws s3 cp --endpoint-url "$R2_ENDPOINT" --no-progress "$@"; }
          DMG="WorkIt-Auto-Apply-$BUILD.dmg"
          # The DMG before the feed that names it: an app reads the feed at any moment.
          put "out/$DMG" "s3://$BUCKET/$DMG" --content-type application/x-apple-diskimage \
            --cache-control "public, max-age=31536000, immutable"
          # The website's link, always the newest build.
          put "out/$DMG" "s3://$BUCKET/WorkIt-Auto-Apply.dmg" --content-type application/x-apple-diskimage \
            --cache-control no-cache --content-disposition 'attachment; filename="WorkIt Auto Apply.dmg"'
          put out/appcast.xml "s3://$BUCKET/appcast.xml" --content-type application/xml --cache-control no-cache

      - name: Check what the apps and the website get
        run: |
          curl -fsS "$SITE/appcast.xml" | grep -q "<sparkle:version>$BUILD</sparkle:version>" \
            || { echo "::error::$SITE/appcast.xml doesn't offer build $BUILD: is the bucket's custom domain connected?"; exit 1; }
          for NAME in "WorkIt-Auto-Apply-$BUILD.dmg" WorkIt-Auto-Apply.dmg; do
            SIZE=$(curl -fsSI "$SITE/$NAME" | grep -i '^content-length:' | tr -dc '0-9')
            [ "$SIZE" = "$(stat -c %s "out/WorkIt-Auto-Apply-$BUILD.dmg")" ] \
              || { echo "::error::$SITE/$NAME isn't this build's DMG."; exit 1; }
          done
          echo "Published build $BUILD: every app gets it at its next check, and the website links it."
