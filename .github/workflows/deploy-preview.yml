name: Deploy preview

# Deploys one branch's website to preview.workitjobs.ai (the workit-web-preview
# Worker), never to production. Run it by hand from the Actions tab with "Use
# workflow from: main" and the branch to show. One preview at a time: the
# last run wins. The website only; the preview uses the production API.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to show at preview.workitjobs.ai
        required: true
        type: string

concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # The branch to show.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      # The preview's config and scripts come from this workflow's own commit,
      # so a branch made before they existed still deploys to the preview.
      - uses: actions/checkout@v4
        with:
          path: preview-tools
          sparse-checkout: |
            frontend/wrangler.preview.jsonc
            .github/scripts/ensure-worker.sh
          sparse-checkout-cone-mode: false
      - name: Use the preview Worker's config
        run: cp ../preview-tools/frontend/wrangler.preview.jsonc wrangler.jsonc
      # Keeps search engines off the preview: its pages are not approved yet.
      # A file in public/ becomes a static asset, served before the Worker.
      - name: Keep search engines out
        run: |
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BRANDFETCH_CLIENT_ID: ${{ vars.NEXT_PUBLIC_BRANDFETCH_CLIENT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npx wrangler whoami
      - run: ../preview-tools/.github/scripts/ensure-worker.sh workit-web-preview
      # No runtime secrets: the preview is for the marketing pages, and
      # Google sign-in, the one thing that needs one, is not set up for it.
      - run: npm run cf:deploy
      - name: Check the preview answers
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null https://preview.workitjobs.ai/; then
              echo "preview.workitjobs.ai shows $BRANCH" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
