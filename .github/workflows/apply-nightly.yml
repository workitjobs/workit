name: Apply nightly

# Apply's tests marked `nightly` (pytest -m nightly): slow browser cases the
# `apply` jobs in ci.yml skip on PRs, for time (KAN-780). Today that is the
# submit guard's matrices on every hostile page and path, beside the one pair per
# page that PRs run, and the control of every page but the three PRs run.
on:
  schedule:
    - cron: "53 7 * * *"
  workflow_dispatch:

jobs:
  # Whether FILL_ENGINE_TOKEN is set: without it the tests below are skipped, and this job's summary says SKIPPED.
  engine:
    uses: ./.github/workflows/engine-token.yml
    with:
      skipped: Apply's nightly tests
    secrets: inherit

  apply:
    needs: engine
    if: needs.engine.outputs.set == 'true'
    # macOS, as ci.yml's apply job: a plain Worker starts through `open`.
    runs-on: macos-latest
    timeout-minutes: 105
    defaults:
      run:
        working-directory: apply-agent
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      - uses: ./.github/actions/apply-setup
      - uses: ./.github/actions/apply-browsers
      # The plain-Worker cases run one at a time in one process (ONE_PLAIN_PROCESS): 887 of the 1132
      # nightly tests, about 4.4 s each on the runner, so about 65 minutes. At 30 the step stopped at 57%
      # every night from 2026-11-11 to 11-13 (KAN-841). Leaving out the pairs whose path finds nothing on
      # its page took them to 574 of 724, and the timed session copies' going to 512 of 787 (KAN-780,
      # 2026-11-14), about 38 minutes. The 84 controls that left PRs joined them (2026-11-14), about 1 s each.
      - name: Nightly tests
        timeout-minutes: 90
        run: uv run pytest -q -rs -n auto --dist loadgroup --durations=15 -m nightly tests/
