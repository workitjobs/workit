name: Extension nightly

# The extension's whole Playwright suite, the speed harness too. The
# `extension` job in ci.yml runs only test/ci-smoke.txt on PRs, for time
# (KAN-464, KAN-736).
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

jobs:
  # Whether FILL_ENGINE_TOKEN is set: without it the suite below is skipped, and this job's summary says SKIPPED.
  engine:
    uses: ./.github/workflows/engine-token.yml
    with:
      skipped: the extension's nightly Playwright suite
    secrets: inherit

  extension:
    needs: engine
    if: needs.engine.outputs.set == 'true'
    # macOS, as most students run Chrome: on Linux, Chromium asks
    # accounts.google.com on its own and scrolls and focuses differently, so
    # a few specs fail there only. Free on a public repo.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: autofiller_extension/test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.FILL_ENGINE_TOKEN }}
      # ci.yml's extension-store-build job has this same step's comment.
      - name: Pin fill-engine to the commit this branch actually records
        run: |
          PINNED=$(git ls-tree HEAD autofiller_extension/fill-engine | awk '{print $3}')
          git -C autofiller_extension/fill-engine fetch --depth 1 origin "$PINNED"
          git -C autofiller_extension/fill-engine checkout --detach "$PINNED"
          echo "fill-engine pinned at: $(git -C autofiller_extension/fill-engine rev-parse HEAD)"
      - uses: ./.github/actions/extension-setup
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extension-test-results
          path: autofiller_extension/test/test-results
          retention-days: 7
