<!doctype html>
<!-- The Address block of Oracle Recruiting Cloud's application, as Honeywell Aerospace's showed it (live, 2026-11-27)
once the country was picked, cut down to its cascading geography fields in Oracle's own markup, with a made-up
address: City, State, County and Zip Code are cx-select boxes that list nothing until searched. City lists
"<city>, <county>, <state>" by what is typed; County and Zip Code then list only the picked city's. The page's
script stands in for Oracle's search: it answers a moment after the typing, and a picked option shows its first
part in the box. -->
<html><head><meta charset="utf-8"><title>Job Application</title>
<style>
  body { font: 14px sans-serif; width: 640px; }
  .input-row { position: relative; margin: 12px 0; }
  .input-row__label { display: block; }
  .cx-select__list { background: #fff; border: 1px solid #888; }
  .cx-select__list-item { padding: 4px; cursor: pointer; }
</style></head>
<body>
<h2 class="apply-flow-section__trainstop-name">Personal Info</h2>

<fieldset class="address-form__group">
  <legend><h3 class="apply-flow-block__title"><span>Address</span></h3></legend>
  <div class="input-row">
    <label class="input-row__label" for="addressLine1-54">Address Line 1</label>
    <div class="input-row__control-container">
      <input class="input-row__control" id="addressLine1-54" name="addressLine1" value="1 Main St"></div>
  </div>
  <div class="input-row input-row--has-picker geo-hierarchy-form-element input-row--invalid">
    <label class="input-row__label cx-select__label input-row__label--required" for="city-57">
      <span class="input-row__label-text">City <span class="cx-select__label--required" aria-hidden="true">*</span></span></label>
    <div class="input-row__control-container reset-z-index">
      <div class="cx-select-container"><div class="input-field-container"><div class="input-field-container__left">
        <input autocomplete="none" name="city" id="city-57" type="text" role="combobox" aria-autocomplete="list"
          aria-describedby="city-57-error" aria-haspopup="listbox" aria-controls="city-57-listbox" aria-expanded="false"
          aria-invalid="true" aria-required="true" class="cx-select-input cx-select-input--invalid" value=""></div>
        <div class="input-field-container__right"><button type="button" id="city-57-toggle-button" tabindex="-1"
          aria-label="Open the drop-down list for City." aria-controls="city-57-listbox" class="icon-dropdown-arrow"></button></div></div></div>
      <p class="input-row__validation" role="" id="city-57-error">The City field is required.</p>
    </div>
  </div>
  <div class="input-row input-row--has-picker geo-hierarchy-form-element input-row--filled">
    <label class="input-row__label cx-select__label input-row__label--required" for="region2-58">
      <span class="input-row__label-text">State <span class="cx-select__label--required" aria-hidden="true">*</span></span></label>
    <div class="input-row__control-container reset-z-index">
      <div class="cx-select-container"><div class="input-field-container"><div class="input-field-container__left">
        <input autocomplete="none" name="region2" id="region2-58" type="text" role="combobox" aria-autocomplete="list"
          aria-describedby="region2-58-error" aria-haspopup="listbox" aria-controls="region2-58-listbox" aria-expanded="false"
          aria-invalid="false" aria-required="true" class="cx-select-input" value="IL"></div></div></div>
    </div>
  </div>
  <div class="input-row input-row--has-picker geo-hierarchy-form-element input-row--invalid">
    <label class="input-row__label cx-select__label input-row__label--required" for="region1-59">
      <span class="input-row__label-text">County <span class="cx-select__label--required" aria-hidden="true">*</span></span></label>
    <div class="input-row__control-container reset-z-index">
      <div class="cx-select-container"><div class="input-field-container"><div class="input-field-container__left">
        <input autocomplete="none" name="region1" id="region1-59" type="text" role="combobox" aria-autocomplete="list"
          aria-describedby="region1-59-error" aria-haspopup="listbox" aria-controls="region1-59-listbox" aria-expanded="false"
          aria-invalid="true" aria-required="true" class="cx-select-input cx-select-input--invalid" value=""></div></div></div>
      <p class="input-row__validation" role="" id="region1-59-error">The County field is required.</p>
    </div>
  </div>
  <div class="input-row input-row--has-picker geo-hierarchy-form-element input-row--invalid">
    <label class="input-row__label cx-select__label input-row__label--required" for="postalCode-60">
      <span class="input-row__label-text">Zip Code <span class="cx-select__label--required" aria-hidden="true">*</span></span></label>
    <div class="input-row__control-container reset-z-index">
      <div class="cx-select-container"><div class="input-field-container"><div class="input-field-container__left">
        <input autocomplete="none" name="postalCode" id="postalCode-60" type="text" role="combobox" aria-autocomplete="list"
          aria-describedby="postalCode-60-error" aria-haspopup="listbox" aria-controls="postalCode-60-listbox" aria-expanded="false"
          aria-invalid="true" aria-required="true" class="cx-select-input cx-select-input--invalid" value=""></div></div></div>
      <p class="input-row__validation" role="" id="postalCode-60-error">The Zip Code field is required.</p>
    </div>
  </div>
</fieldset>

<script>
// Oracle's geography search, made up: every city, its county and state, and its zip codes.
const PLACES = [
  ['Springfield', 'Sangamon', 'IL', ['62701', '62702', '62703']],
  ['Springfield', 'Clark', 'OH', ['45501', '45502']],
  ['Springfield', 'Hampden', 'MA', ['01103']],
  ['Springfield Gardens', 'Queens', 'NY', ['11413']],
  ['Shelbyville', 'Shelby', 'IL', ['62565']],
];
const city = () => PLACES.find(([name, county, state]) => document.body.dataset.city === `${name}, ${county}, ${state}`);
// What each box lists for the words typed in it: nothing until searched, as Oracle's does for 500+ places.
function listed(box, typed) {
  const starts = (name) => typed && name.toLowerCase().startsWith(typed.toLowerCase());
  if (box.name === 'city') return PLACES.map(([n, c, s]) => `${n}, ${c}, ${s}`).filter(starts);
  const [name, county, state, zips] = city() || ['', '', '', []];
  if (box.name === 'region1') return (county ? [`${county}, ${state}`] : ['Sangamon, IL', 'Shelby, IL', 'Clark, OH']).filter(starts);
  if (box.name === 'postalCode') return zips.map(zip => `${zip}, ${name}`).filter(starts);
  return ['IL', 'MA', 'NY', 'OH'].filter(starts);
}
let open = null, timer = null;
function shut() {
  if (!open) return;
  open.setAttribute('aria-expanded', 'false');
  const list = document.getElementById(open.getAttribute('aria-controls'));
  if (list) list.remove();
  open = null;
}
function draw(box) {
  shut();
  open = box;
  box.setAttribute('aria-expanded', 'true');
  const list = document.createElement('div');
  list.setAttribute('role', 'listbox');
  list.id = box.getAttribute('aria-controls');
  list.className = 'cx-select__list';
  for (const name of listed(box, box.value)) {
    const option = document.createElement('div');
    option.setAttribute('role', 'option');
    option.className = 'cx-select__list-item';
    option.textContent = name;
    option.addEventListener('click', () => choose(box, name));
    list.appendChild(option);
  }
  box.closest('.input-row__control-container').appendChild(list);
}
function choose(box, name) {
  box.value = name.split(',')[0];
  if (box.name === 'city') document.body.dataset.city = name;
  box.dispatchEvent(new Event('change', {bubbles: true}));
  shut();
}
document.addEventListener('click', (event) => {
  const box = event.target.closest('[role=combobox]');
  if (box) draw(box);
});
// The search answers a moment after the last key, as Oracle's does from its server.
document.addEventListener('input', (event) => {
  const box = event.target.closest('[role=combobox]');
  if (!box) return;
  shut();
  clearTimeout(timer);
  timer = setTimeout(() => draw(box), 300);
});
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') shut(); });
</script>
</body></html>
