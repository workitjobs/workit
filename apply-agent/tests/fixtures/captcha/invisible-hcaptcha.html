<!doctype html>
<!-- An Oracle Recruiting step with an invisible hCaptcha, as JPMorgan's showed it (2026-11-10, KAN-760): the widget's
     frame is 0x0, and its challenge's frame sits in the page while it is closed, parked off the page, hidden and
     see-through. No challenge shows to a person. {{CHALLENGE}} is replaced by a test to open or hide it other ways. -->
<html lang="en">
<head><meta charset="utf-8"><title>Job Application - Contact Information</title></head>
<body>
<main>
  <h1>Contact Information</h1>
  <form id="apply-flow" onsubmit="return false">
    <label for="first">First Name</label> <input id="first" name="firstName" required>
    <label for="last">Last Name</label> <input id="last" name="lastName" required>
    <label for="phone">Phone Number</label> <input id="phone" name="phone" type="tel">
    <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001" data-size="invisible">
      <iframe src="https://newassets.hcaptcha.com/captcha/v1/static/hcaptcha.html#frame=checkbox-invisible&amp;id=0a1b2c"
              title="Widget containing checkbox for hCaptcha security challenge" tabindex="-1"
              style="pointer-events: none; width: 0px; height: 0px; border: 0px;"></iframe>
      <textarea name="h-captcha-response" style="display: none"></textarea>
    </div>
    <button type="button">Next</button>
  </form>
</main>
<div id="challenge-box" style="{{CHALLENGE}}">
  <div style="width: 100%; height: 100%; position: fixed; pointer-events: none; top: 0; left: 0; z-index: 1;
              background-color: rgb(255, 255, 255); opacity: 0.05;"></div>
  <div style="border: 1px solid rgb(215, 215, 215); background-color: rgb(255, 255, 255); position: absolute;
              z-index: 2147483647; top: 40px; left: 40px;">
    <iframe src="https://newassets.hcaptcha.com/captcha/v1/static/hcaptcha.html#frame=challenge&amp;id=0a1b2c"
            title="Main content of the hCaptcha challenge" frameborder="0" scrolling="no"
            style="border: 0; z-index: 2000000000; position: relative; width: 400px; height: 580px;"></iframe>
  </div>
</div>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</body>
</html>
